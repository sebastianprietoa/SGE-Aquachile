services:
  postgres:
    image: postgres:16-alpine
    container_name: sge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sge_aquachile}
      POSTGRES_USER: ${POSTGRES_USER:-sge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sge_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sge_user} -d ${POSTGRES_DB:-sge_aquachile}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sge-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://sge_user:sge_password@postgres:5432/sge_aquachile}
      SECRET_KEY: ${SECRET_KEY:-change-me-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sge-frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

